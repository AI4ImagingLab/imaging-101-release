name: imaging-101-explicit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.11
  - pip=26.2.1
  - pip:
      - numpy==2.4.6
      - scipy==1.17.1
      - matplotlib==3.11.1
      - pillow==12.3.0
      - pytest==9.1.1
      - nbformat==5.11.1
      - nbconvert==7.17.1
      - ipykernel==7.3.0
variables:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
